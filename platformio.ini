; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

; Arduino Nano + DHT11 (D2): sends temperature/humidity to the ESP32 over SoftwareSerial (D10=RX, D11=TX)
; Build/flash: pio run -e nano_dht_bluetooth -t upload
[env:nano_dht_bluetooth]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 9600
build_src_filter = -<*> +<../examples/nano_dht_bluetooth/>
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

; ESP32 DevKit: reads the Nano on UART2 (GPIO16=RX, GPIO17=TX) and forwards to the phone over Bluetooth Classic
; Build/flash: pio run -e esp32_bluetooth_bridge -t upload
[env:esp32_bluetooth_bridge]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../examples/esp32_bluetooth_bridge/>

; ESP32 + DHT11 (GPIO32) -> Blynk Cloud every 10 minutes (V0 temperature, V1 humidity)
; Needs include/blynk_secrets.h (copy from blynk_secrets.example.h)
; Build/flash: pio run -e blynk_dht11 -t upload && pio device monitor -e blynk_dht11
[env:blynk_dht11]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../examples/blynk_dht11/>
lib_deps =
    blynkkk/Blynk@^1.3.2
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
